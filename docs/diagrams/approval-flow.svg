<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Approval flow for write tools</text>

  <!-- 1. Propose -->
  <rect x="40" y="56" width="260" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">1. Propose</text>
  <text x="170" y="104" text-anchor="middle" font-size="12" fill="#78350f">write tool called by the model</text>
  <line x1="170" y1="120" x2="170" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. Pending -->
  <rect x="40" y="150" width="260" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">2. Pending</text>
  <text x="170" y="198" text-anchor="middle" font-size="12" fill="#5b21b6">action stored with status pending</text>
  <line x1="170" y1="214" x2="170" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Human decision -->
  <polygon points="170,248 300,320 170,392 40,320" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="170" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">3. Human</text>
  <text x="170" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">decides</text>

  <!-- Reject branch -->
  <line x1="170" y1="392" x2="170" y2="436" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="182" y="418" font-size="12" fill="#475569">reject</text>
  <rect x="40" y="438" width="260" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="170" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Rejected (terminal)</text>
  <text x="170" y="478" text-anchor="middle" font-size="12" fill="#991b1b">nothing executes</text>

  <!-- Approve branch -->
  <line x1="300" y1="320" x2="378" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="304" y="310" font-size="12" fill="#475569">approve</text>

  <!-- 4. Execute -->
  <rect x="380" y="290" width="200" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="480" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#075985">4. Execute</text>
  <text x="480" y="336" text-anchor="middle" font-size="12" fill="#0c4a6e">backend.apply(kind, params)</text>

  <!-- Success -->
  <line x1="480" y1="290" x2="480" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="492" y="252" font-size="12" fill="#475569">no exception</text>
  <rect x="380" y="152" width="220" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Approved (terminal)</text>
  <text x="490" y="194" text-anchor="middle" font-size="12" fill="#166534">result stored, status approved</text>

  <!-- Failure -->
  <line x1="480" y1="350" x2="480" y2="408" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="492" y="384" font-size="12" fill="#475569">exception raised</text>
  <rect x="380" y="410" width="220" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="490" y="434" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">Failed (terminal)</text>
  <text x="490" y="452" text-anchor="middle" font-size="12" fill="#991b1b">error stored, not retried</text>

  <!-- Rules panel -->
  <rect x="650" y="56" width="230" height="412" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="666" y="84" font-size="14" font-weight="bold" fill="#0f172a">Rules enforced in code</text>
  <text x="666" y="112" font-size="12" fill="#334155">- Only a pending action can be</text>
  <text x="666" y="128" font-size="12" fill="#334155">  approved or rejected.</text>
  <text x="666" y="152" font-size="12" fill="#334155">- Approve or reject on an ID that</text>
  <text x="666" y="168" font-size="12" fill="#334155">  is not pending: ValueError.</text>
  <text x="666" y="192" font-size="12" fill="#334155">- Failed actions are not retried.</text>
  <text x="666" y="216" font-size="12" fill="#334155">- The model has no approve or</text>
  <text x="666" y="232" font-size="12" fill="#334155">  reject tool.</text>
  <text x="666" y="256" font-size="12" fill="#334155">- The CLI approver is the fixed</text>
  <text x="666" y="272" font-size="12" fill="#334155">  string cli-user.</text>
  <text x="666" y="296" font-size="12" fill="#334155">- No dollar thresholds, no expiry,</text>
  <text x="666" y="312" font-size="12" fill="#334155">  no separation of duties.</text>
  <text x="666" y="336" font-size="12" fill="#334155">- Nothing in a write tool changes</text>
  <text x="666" y="352" font-size="12" fill="#334155">  data until apply() runs.</text>
</svg>
