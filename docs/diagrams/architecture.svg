<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Tallyhand architecture</text>

  <!-- Claude API -->
  <rect x="330" y="50" width="240" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1b4b">Claude API</text>
  <text x="450" y="94" text-anchor="middle" font-size="12" fill="#312e81">model from SELLER_AGENT_MODEL</text>

  <!-- Assistant -->
  <rect x="300" y="140" width="300" height="72" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Assistant (assistant.py)</text>
  <text x="450" y="190" text-anchor="middle" font-size="12" fill="#334155">tool-use loop, MAX_TURNS = 8</text>
  <line x1="450" y1="106" x2="450" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="462" y="126" font-size="12" fill="#475569">tool_use / tool_result</text>

  <!-- Read tools -->
  <rect x="40" y="270" width="280" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Read tools (14)</text>
  <text x="180" y="320" text-anchor="middle" font-size="12" fill="#1e3a8a">sales, order operations, marketing,</text>
  <text x="180" y="338" text-anchor="middle" font-size="12" fill="#1e3a8a">inventory, administration</text>

  <!-- Write tools -->
  <rect x="580" y="270" width="280" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="720" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">Write tools (4): propose only</text>
  <text x="720" y="320" text-anchor="middle" font-size="12" fill="#78350f">propose_price_change, propose_refund,</text>
  <text x="720" y="338" text-anchor="middle" font-size="12" fill="#78350f">propose_ad_budget_change, propose_restock</text>

  <line x1="360" y1="212" x2="200" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="262" y="232" text-anchor="end" font-size="12" fill="#475569">read calls</text>
  <line x1="540" y1="212" x2="700" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="640" y="232" font-size="12" fill="#475569">propose calls</text>

  <!-- Backend -->
  <rect x="40" y="430" width="280" height="80" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="180" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Backend (backend.py)</text>
  <text x="180" y="480" text-anchor="middle" font-size="12" fill="#374151">FixtureBackend: synthetic, seeded</text>
  <text x="180" y="498" text-anchor="middle" font-size="12" fill="#6b7280">SP-API and Ads API: not built</text>
  <line x1="180" y1="360" x2="180" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="192" y="398" font-size="12" fill="#475569">reads</text>

  <!-- ActionQueue -->
  <rect x="580" y="430" width="280" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="720" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">ActionQueue (actions.py)</text>
  <text x="720" y="480" text-anchor="middle" font-size="12" fill="#5b21b6">pending, then approved, rejected or failed</text>
  <line x1="720" y1="360" x2="720" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="732" y="398" font-size="12" fill="#475569">queues pending action</text>

  <!-- ActionQueue to Backend, only after approval -->
  <line x1="578" y1="470" x2="322" y2="470" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="462" text-anchor="middle" font-size="12" fill="#5b21b6">apply() runs only after approval</text>

  <!-- Human approver -->
  <rect x="330" y="500" width="240" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="526" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Human approver</text>
  <text x="450" y="546" text-anchor="middle" font-size="12" fill="#166534">CLI /approve, /reject</text>
  <line x1="570" y1="522" x2="662" y2="510" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="580" y="552" font-size="12" fill="#166534">approve or reject</text>

  <!-- Guardrail note -->
  <text x="450" y="586" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">The assistant cannot approve: no approve tool is exposed to the model.</text>

  <rect x="620" y="36" width="260" height="44" rx="8" fill="none" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="750" y="54" text-anchor="middle" font-size="12" fill="#b91c1c">Tool results are data, not</text>
  <text x="750" y="72" text-anchor="middle" font-size="12" fill="#b91c1c">instructions (system prompt rule)</text>
</svg>
