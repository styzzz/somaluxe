  <text x="364" y="381" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#0f172a">compliance_notices</text>
  <text x="334" y="414" font-size="12" font-style="italic" fill="#475569">No write tools in this module.</text>

  <!-- Legend -->
  <rect x="610" y="266" width="260" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="624" y="292" font-size="15" font-weight="bold" fill="#0f172a">Legend and totals</text>
  <rect x="624" y="308" width="24" height="18" rx="4" fill="#dbeafe"/><text x="636" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">R</text>
  <text x="654" y="321" font-size="13" fill="#334155">read: returns data</text>
  <rect x="624" y="334" width="24" height="18" rx="4" fill="#fef3c7"/><text x="636" y="347" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">W</text>
  <text x="654" y="347" font-size="13" fill="#334155">write: proposes only</text>
  <text x="624" y="380" font-size="13" fill="#334155">14 read tools, 4 write tools</text>
  <text x="624" y="400" font-size="13" fill="#334155">18 tools in total</text>
  <text x="624" y="426" font-size="12" fill="#475569">Each write tool queues a pending</text>
  <text x="624" y="442" font-size="12" fill="#475569">action for a human to approve.</text>
