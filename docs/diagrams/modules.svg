  <text x="74" y="409" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#0f172a">propose_restock</text>

  <!-- Administration -->
  <rect x="320" y="266" width="260" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="320" y="266" width="260" height="36" rx="10" fill="#ede9fe"/>
  <rect x="320" y="288" width="260" height="14" fill="#ede9fe"/>
  <text x="334" y="290" font-size="15" font-weight="bold" fill="#4c1d95">Administration</text>
  <rect x="334" y="312" width="24" height="18" rx="4" fill="#dbeafe"/><text x="346" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">R</text>
  <text x="364" y="325" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#0f172a">account_health</text>
  <rect x="334" y="340" width="24" height="18" rx="4" fill="#dbeafe"/><text x="346" y="353" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">R</text>
  <text x="364" y="353" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#0f172a">reconcile_payouts</text>
