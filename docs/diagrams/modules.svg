  <rect x="44" y="102" width="24" height="18" rx="4" fill="#dbeafe"/><text x="56" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">R</text>
  <text x="74" y="115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#0f172a">sales_summary</text>
  <rect x="44" y="130" width="24" height="18" rx="4" fill="#dbeafe"/><text x="56" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">R</text>
  <text x="74" y="143" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#0f172a">top_products</text>
